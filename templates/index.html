<!DOCTYPE html>
<html>
<head>
    <title>Чат XiaoZhi AI</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="/static/styles.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <div class="chat-container">
        <div class="header">
            <h1 class="text-2xl font-bold">Чат XiaoZhi AI</h1>
        </div>
        <div class="p-4 bg-gray-50 border-b">
            <span id="connectionStatus" class="status disconnected">Не подключено</span>
            <span class="text-sm text-gray-600">ID устройства: {{ device_id }}</span>
        </div>
        <div class="chat-box" id="chatBox"></div>
        <div class="input-container">
            <input type="text" id="messageInput" placeholder="Введите сообщение...">
            <button class="btn-primary" id="sendBtn">Отправить</button>
        </div>
    </div>

    <script>
        (function() {
            let ws = null;
            let sessionId = null;
            const wsUrl = `wss://${window.location.host}/`;
            const statusEl = document.getElementById('connectionStatus');
            const chatBox = document.getElementById('chatBox');
            const input = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');

            function setStatus(text, state) {
                statusEl.textContent = text;
                statusEl.className = `status ${state}`;
            }

            function appendMessage(type, text) {
                const div = document.createElement('div');
                div.className = `message ${type}`;
                const content = document.createElement('div');
                content.className = 'message-content';
                content.innerHTML = text.replace(/\n/g, '<br>');
                const time = document.createElement('div');
                time.className = 'message-time';
                time.textContent = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                div.appendChild(content);
                div.appendChild(time);
                chatBox.appendChild(div);
                chatBox.scrollTop = chatBox.scrollHeight;
            }

            function connect() {
                if (ws && ws.readyState === WebSocket.OPEN) return;
                ws = new WebSocket(wsUrl);
                ws.onopen = function() {
                    console.log('WebSocket открыт');
                    setStatus('Подключено', 'connected');
                    const hello = JSON.stringify({
                        type: "hello",
                        version: 1,
                        transport: "websocket",
                        audio_params: {
                            format: "opus",
                            sample_rate: 16000,
                            channels: 1,
                            frame_duration: 60
                        }
                    });
                    ws.send(hello);
                };
                ws.onmessage = function(event) {
                    try {
                        const data = JSON.parse(event.data);
                        if (data.type === 'hello') {
                            sessionId = data.session_id;
                            console.log('session_id:', sessionId);
                            appendMessage('system', '✅ Сессия установлена');
                        } else if (data.type === 'stt') {
                            // распознанная речь
                            if (data.text) appendMessage('user', data.text);
                        } else if (data.type === 'tts') {
                            if (data.state === 'start' && data.text) {
                                appendMessage('server', data.text);
                            }
                        }
                    } catch (e) {
                        console.error('Ошибка парсинга:', e);
                    }
                };
                ws.onclose = function() {
                    setStatus('Не подключено', 'disconnected');
                    sessionId = null;
                    setTimeout(connect, 3000);
                };
                ws.onerror = function() {
                    setStatus('Ошибка', 'error');
                };
            }

            function sendMessage() {
                const text = input.value.trim();
                if (!text || !ws || ws.readyState !== WebSocket.OPEN || !sessionId) {
                    appendMessage('error', '❌ Нет соединения или сессии');
                    return;
                }
                const msg = JSON.stringify({
                    type: "listen",
                    state: "detect",
                    text: text,
                    source: "text"
                });
                ws.send(msg);
                appendMessage('user', text);
                input.value = '';
            }

            sendBtn.addEventListener('click', sendMessage);
            input.addEventListener('keypress', function(e) { if (e.key === 'Enter') sendMessage(); });

            connect();
        })();
    </script>
</body>
</html>
